name: Release

# Push a `vX.Y.Z` tag matching Cargo.toml's version to build binaries and publish a
# GitHub release. The musl targets are built in the same rust:1.99-alpine image the
# Dockerfile uses (static binaries); Windows is not attempted yet.
# A manual run (workflow_dispatch) is a dry run: it builds and uploads the tarballs as
# workflow artifacts but never publishes a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry run from a branch
        if: github.ref_type != 'tag'
        run: echo "dry run from ${GITHUB_REF_NAME}; version check skipped"
      - name: tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        if: ${{ !matrix.musl }}
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      # Skipped for musl: docker writes target/ as root, which the cache post-step can't save.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.musl }}
        with:
          key: ${{ matrix.target }}
      - name: build
        if: ${{ !matrix.musl }}
        run: UCG_GIT_SHA="${GITHUB_SHA::12}" cargo build --release --locked --target "${{ matrix.target }}"
      - name: build (musl, static)
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e UCG_GIT_SHA="${GITHUB_SHA::12}" rust:1.99-alpine \
            sh -c 'apk add --no-cache musl-dev && cargo build --release --locked --target "${{ matrix.target }}"'
          file "target/${{ matrix.target }}/release/ucgeocoder" | tee /dev/stderr | grep -q 'static'
      - name: package
        id: package
        shell: bash
        run: |
          name="ucgeocoder-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ucgeocoder" README.md LICENSE ucgeocoder.example.toml "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256

  release:
    needs: build
    # Only a tag push publishes; a manual run against a tag ref must not.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
